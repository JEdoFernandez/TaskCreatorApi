version: '3.8'
services:
  api:
    build: .
    ports:
      - "7012:8080" 
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=TaskCreatorDB;User=sa;Password=Your_password123;TrustServerCertificate=true;
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "2107:1433" 
    volumes:
      - sql-data:/var/opt/mssql   # <--- CORRECTO
    networks:
      - app-network

volumes:
  sql-data:

networks:
  app-network:
    driver: bridge
